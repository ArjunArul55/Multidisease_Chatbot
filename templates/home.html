<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Medibot - Professional AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
</head>

<body>
  <section class="msger">
    <header class="msger-header">
      <div class="msger-header-title">
        MEDIBOT
      </div>
    </header>

    <main class="msger-chat">
      <div class="msg left-msg">
        <div class="msg-img" style="background-image: url(https://promptsforge.com/images/e4fdfae5-1429-49d9-8843-938e1d0b5092.webp)"></div>
        <div class="msg-bubble">
          <div class="msg-info">
            <div class="msg-info-name">Medibot</div>
          </div>
          <div class="msg-text">
            Hello, my name is Medibot, and I will be happy to help diagnose your disease. 
          </div>
        </div>
      </div>

      <div class="msg left-msg">
        <div class="msg-img" style="background-image: url(https://promptsforge.com/images/e4fdfae5-1429-49d9-8843-938e1d0b5092.webp)"></div>
        <div class="msg-bubble">
          <div class="msg-info">
            <div class="msg-info-name">Medibot - Your AI Health Assisstant
            </div>
          </div>
          <div class="msg-text">
            To start, we need to ask some basic questions, tap OK to continue ! 
          </div>
        </div>
      </div>
    </main>
      
    <form class="msger-inputarea">
      <input type="text" class="msger-input" id="textInput" placeholder="Enter your message...">
      <button type="submit" class="msger-send-btn">Send</button>
    </form>
  </section>
  
  <script src='https://use.fontawesome.com/releases/v5.0.13/js/all.js'></script>
  <script>
    const msgerForm = get(".msger-inputarea");
    const msgerInput = get(".msger-input");
    const msgerChat = get(".msger-chat");

    // Updated Icons
    const BOT_IMG = "https://promptsforge.com/images/e4fdfae5-1429-49d9-8843-938e1d0b5092.webp"; // Professional Doctor/Robot Icon
    const PERSON_IMG = "https://cdn.pixabay.com/photo/2018/04/18/18/56/user-3331256_1280.png"; // Clean User Avatar
    const BOT_NAME = "Medibot"; 
    const PERSON_NAME = "You";

    msgerForm.addEventListener("submit", event => {
      event.preventDefault();
      const msgText = msgerInput.value;
      if (!msgText) return;

      appendMessage(PERSON_NAME, PERSON_IMG, "right", msgText);
      msgerInput.value = "";
      botResponse(msgText);
    });

    function appendMessage(name, img, side, text) {
      const msgHTML = `
<div class="msg ${side}-msg">
  <div class="msg-img" style="background-image: url(${img})"></div>

  <div class="msg-bubble">
    <div class="msg-info">
      <div class="msg-info-name">${name}</div>
      <div class="msg-info-time">${formatDate(new Date())}</div>
    </div>

    <div class="msg-text">${text}</div>
  </div>
</div>
`;

      msgerChat.insertAdjacentHTML("beforeend", msgHTML);
      msgerChat.scrollTop += 500;
    }

    function botResponse(rawText) {
      // Bot Response - This uses the AJAX call to your backend
      $.get("/get", { msg: rawText }).done(function (data) {
        console.log(rawText);
        console.log(data);
        const msgText = data;
        appendMessage(BOT_NAME, BOT_IMG, "left", msgText);
      });
    }

    // Utils
    function get(selector, root = document) {
      return root.querySelector(selector);
    }

    function formatDate(date) {
      const h = "0" + date.getHours();
      const m = "0" + date.getMinutes();
      return `${h.slice(-2)}:${m.slice(-2)}`;
    }
  </script>

</body>

</html>
